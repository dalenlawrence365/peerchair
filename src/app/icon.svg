  <!-- Right back leg -->
  <rect x="22" y="14" width="3" height="4" rx="1" fill="#aa1a00"/>
  <!-- Seat highlight -->
  <rect x="5" y="17" width="22" height="2" rx="1" fill="#dd3311" opacity="0.5"/>
